[tool.poetry]
name = "machine-translation-with-attention-mechanism-from-spanish-to-english-translation"
version = "0.1.0"
description = ""
authors = ["Mohammad Wasil Saleem <wasilmohd1@gmail.com>"]
packages = []

[tool.poetry.dependencies]
python = ">=3.7.1,<=3.8"
torch = {version = "1.7.1+cu101", source = "pytorch"}
torchtext = "0.8.0"
spacy = "3.1.1"
numpy = "1.21.5"
pandas = "1.3.5"
tqdm = "4.67.1"
nltk = "3.6.7"
pyyaml = "6.0.1"

[tool.poetry.group.dev.dependencies]
mypy = "1.1.1"
pre-commit = "2.21.0"
pre-commit-hooks = "4.4.0"
ruff = "0.12.11"
types-pyyaml = "6.0.12.6"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/torch_stable.html"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
src = ["src"]
target-version = "py37"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "COM812", "D107", "ISC001", "D100", "D101", "C901", "D102", "PLR0912", "PLR0915", "E501", "N999"]

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
ignore_missing_imports = true


[tool.pytest.ini_options]
pythonpath = ["."]
